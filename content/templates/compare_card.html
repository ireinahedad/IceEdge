<!doctype html>
<!-- Variante du plan 3 — deux entités face à face. Utile quand l'histoire EST
     l'écart : domicile contre extérieur, cette saison contre la précédente. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"><script src="_anim.js"></script></head>
<body>
  <div class="slide">
    <div class="topbar">
      <div class="subject">{{subject}}</div>
      <div class="season-label">{{season_label}}</div>
    </div>
    <div class="pair">
      <div><div class="big">{{left_value}}</div><div class="sub">{{left_label}}</div></div>
      <div><div class="big">{{right_value}}</div><div class="sub">{{right_label}}</div></div>
    </div>
    <div class="body-text">{{text}}</div>
  </div>
</body></html>
