<!doctype html>
<!-- Récap — la feuille de match, but par but. Neuf lignes au maximum,
     build-recap.ts découpe au-delà. Bloc généré par render-slides.ts à partir
     du champ `goals` du plan. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
  <div class="slide">
    <div class="topbar">
      <div class="subject">{{subject}}</div>
      <div class="season-label">{{season_label}}</div>
    </div>
    <div class="recap">{{block}}</div>
    <div class="sub">{{text}}</div>
  </div>
</body></html>
