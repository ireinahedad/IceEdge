<!doctype html>
<!-- Récap — les étoiles. Trois pour un match ou une nuit, une seule pour le
     format court. Les étoiles sont celles désignées par la LNH (summary.threeStars),
     pas un classement maison : c'est une donnée officielle, elle ne se discute pas.
     Bloc généré par render-slides.ts à partir du champ `stars` du plan. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
  <div class="slide">
    <div class="topbar">
      <div class="subject">{{subject}}</div>
      <div class="season-label">{{season_label}}</div>
    </div>
    <div class="recap">{{block}}</div>
    <div class="sub">{{text}}</div>
  </div>
</body></html>
