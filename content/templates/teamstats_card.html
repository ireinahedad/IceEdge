<!doctype html>
<!-- Récap — les totaux d'équipe, plus la ligne des gardiens.

     Les deux vivent sur le même plan parce qu'ils répondent à la même question :
     qui a dominé le match. Les séparer aurait donné deux plans de tableau à la
     suite, ce que personne ne regarde jusqu'au bout.

     Bloc généré par render-slides.ts à partir du champ `stats` du plan. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
  <div class="slide">
    <div class="topbar">
      <div class="subject">{{subject}}</div>
      <div class="season-label">{{season_label}}</div>
    </div>
    <div class="recap">{{block}}</div>
    <div class="sub">{{text}}</div>
  </div>
</body></html>
