<!doctype html>
<!-- Récap — le score final d'un match.

     Le bloc central est GÉNÉRÉ par render-slides.ts à partir du champ `game` du
     plan : logos inlinés en data-URI, couleurs de club, ligne des périodes.
     Même raisonnement que chart_card — le contenu est dessiné en code, le style
     se règle ici et dans _shared.css.

     Ouvrir ce fichier dans Chrome montre le gabarit vide : c'est
     `npm run content:render -- --preview` qui donne le rendu avec les données. -->
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="_shared.css"></head>
<body>
  <div class="slide">
    <div class="topbar">
      <div class="subject">{{subject}}</div>
      <div class="season-label">{{season_label}}</div>
    </div>
    <div class="recap">{{block}}</div>
    <div class="sub">{{text}}</div>
  </div>
</body></html>
