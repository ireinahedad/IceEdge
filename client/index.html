<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover est OBLIGATOIRE pour que env(safe-area-inset-*) soit
         autre chose que 0px sur iPhone. Sans lui, tous les paddings
         `env(safe-area-inset-top)` de l'app valaient 0 : le contenu passait sous
         l'encoche en PWA (status-bar-style=black-translucent) et passera sous
         l'encoche ET l'indicateur d'accueil dans le WKWebView Capacitor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ArakIce | NHL Predictions, Picks and Player Props Powered by ML</title>
    <meta name="description" content="Statistical edge for smarter sports bets. NHL win probabilities, totals and player prop projections powered by machine learning." />
    <link rel="canonical" href="https://arakice.com/" />
    <meta name="robots" content="index, follow, max-image-preview:large" />

    <!-- Favicons: opaque #0A0E0C background so the mark stays visible on the
         light surfaces that flatten transparency (Google SERP, iOS home screen).
         Sizes are multiples of 48px, which is what Google's favicon crawler wants. -->
    <link rel="icon" type="image/png" sizes="96x96" href="/arakice-icon-96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/arakice-icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/arakice-icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/arakice-icon-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta name="theme-color" content="#0A0E0C" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ArakIce" />

    <!-- Social sharing (X, Facebook, LinkedIn, Discord, iMessage, Slack) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ArakIce" />
    <meta property="og:locale" content="en_CA" />
    <meta property="og:locale:alternate" content="fr_CA" />
    <meta property="og:title" content="ArakIce | NHL Predictions, Picks and Player Props" />
    <meta property="og:description" content="Statistical edge for smarter sports bets. NHL win probabilities, totals and player prop projections powered by machine learning." />
    <meta property="og:url" content="https://arakice.com/" />
    <meta property="og:image" content="https://arakice.com/arakice-og.png" />
    <meta property="og:image:secure_url" content="https://arakice.com/arakice-og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="ArakIce, NHL predictions powered by ML" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ArakIce | NHL Predictions, Picks and Player Props" />
    <meta name="twitter:description" content="NHL win probabilities, totals and player prop projections powered by machine learning." />
    <meta name="twitter:image" content="https://arakice.com/arakice-og.png" />
    <meta name="twitter:image:alt" content="ArakIce, NHL predictions powered by ML" />

    <!-- Fonts: Oswald (display/numbers) + Inter (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      /* ── Design tokens ── */
      :root {
        --color-base:       #0A0E0C;
        --color-surface:    #131A12;
        --color-surface2:   #1B2419;
        --color-border:     #283323;
        --color-text:       #F3F7F0;
        --color-text-muted: #92A08A;
        --color-accent:     #9BF019;
        --color-accent2:    #008200;
        --color-edge-high:  #D2FF28;
        --color-edge-mid:   #4BD200;
        --color-edge-low:   #3A4339;
        --color-success:    #4BD200;
        --color-danger:     #E5564D;
        --color-logo-blue:  #1A8AFF;
      }

      html, body {
        height: 100%;
        margin: 0;
        background-color: var(--color-base);
        color: var(--color-text);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root { height: 100%; }
      ::-webkit-scrollbar { width: 0; }
      .font-display { font-family: 'Oswald', sans-serif; }

      /* Crawlable fallback nav — only ever painted when JS is unavailable. */
      .no-js-nav { padding: 32px 20px; max-width: 760px; margin: 0 auto; }
      .no-js-nav h1 { font-family: 'Oswald', sans-serif; font-size: 28px; margin: 0 0 8px; }
      .no-js-nav p { color: var(--color-text-muted); margin: 0 0 20px; }
      .no-js-nav ul { list-style: none; padding: 0; margin: 0; }
      .no-js-nav li { margin-bottom: 10px; }
      .no-js-nav a { color: var(--color-accent); text-decoration: none; font-weight: 500; }
    </style>

    <!--
      Structured data. Google builds sitelinks and the displayed site name from
      Organization / WebSite markup on the homepage plus its own crawl of the
      internal links below. Sitelinks cannot be requested — this only gives the
      algorithm the signals it looks for.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://arakice.com/#organization",
          "name": "ArakIce",
          "alternateName": "ArakIce NHL Predictions",
          "url": "https://arakice.com/",
          "logo": {
            "@type": "ImageObject",
            "url": "https://arakice.com/arakice-icon-512.png",
            "width": 512,
            "height": 512
          },
          "image": "https://arakice.com/arakice-og.png",
          "description": "ArakIce is a machine-learning NHL prediction platform providing win probabilities, totals and player-prop projections for informational and entertainment purposes.",
          "sameAs": ["https://www.instagram.com/arakice.news/"]
        },
        {
          "@type": "WebSite",
          "@id": "https://arakice.com/#website",
          "name": "ArakIce",
          "alternateName": "ArakIce NHL Predictions",
          "url": "https://arakice.com/",
          "inLanguage": ["en-CA", "fr-CA"],
          "publisher": { "@id": "https://arakice.com/#organization" }
        },
        {
          "@type": "SiteNavigationElement",
          "@id": "https://arakice.com/#nav",
          "name": [
            "NHL Predictions",
            "Tonight's NHL Games",
            "NHL Team Stats Charts",
            "NHL Bet Builder",
            "NHL Player Props",
            "NHL Standings",
            "Sign In",
            "About"
          ],
          "url": [
            "https://arakice.com/nhl-predictions",
            "https://arakice.com/schedule",
            "https://arakice.com/stats/chart/all-teams",
            "https://arakice.com/bet",
            "https://arakice.com/nhl-player-props",
            "https://arakice.com/league",
            "https://arakice.com/login",
            "https://arakice.com/about"
          ]
        }
      ]
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <noscript>
      <nav class="no-js-nav" aria-label="ArakIce sections">
        <h1>ArakIce</h1>
        <p>NHL predictions, picks and player prop projections powered by machine learning.</p>
        <ul>
          <li><a href="/nhl-predictions">NHL Predictions</a>, model win probabilities for every game</li>
          <li><a href="/schedule">Tonight's NHL Games</a>, today's slate with model picks</li>
          <li><a href="/stats/chart/all-teams">NHL Team Stats Charts</a>, all 32 teams compared</li>
          <li><a href="/bet">NHL Bet Builder</a>, score any slip against the model</li>
          <li><a href="/nhl-player-props">NHL Player Props</a>, shots, points and goals projections</li>
          <li><a href="/league">NHL Standings</a>, divisions and league wide form</li>
          <li><a href="/nhl-predictions-today">NHL Predictions Today</a>, tonight's picks explained</li>
          <li><a href="/about">About</a>, the model, our principles, responsible betting</li>
          <li><a href="/login">Sign In</a>, save slips and track your history</li>
        </ul>
      </nav>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
