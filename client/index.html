<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover est OBLIGATOIRE pour que env(safe-area-inset-*) soit
         autre chose que 0px sur iPhone. Sans lui, tous les paddings
         `env(safe-area-inset-top)` de l'app valaient 0 : le contenu passait sous
         l'encoche en PWA (status-bar-style=black-translucent) et passera sous
         l'encoche ET l'indicateur d'accueil dans le WKWebView Capacitor. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ArakIce | NHL Predictions, Picks and Player Props Powered by ML</title>
    <meta name="description" content="Statistical edge for smarter sports bets. NHL win probabilities, totals and player prop projections powered by machine learning." />

    <!-- Favicons: opaque #0A0E0C background so the mark stays visible on the
         light surfaces that flatten transparency (Google SERP, iOS home screen).

    <link rel="icon" type="image/png" sizes="192x192" href="/arakice-icon-192.png" />

    <!-- Fonts: Oswald (display/numbers) + Inter (body) + Merriweather 700 (5 titres),
         hébergées dans public/fonts (latin + latin-ext ; Oswald et Inter en variable).
         Plus de Google Fonts : la requête bloquait ~750 ms (PSI mobile, 2026-10-07) et
         l'app iOS embarque ainsi ses polices. Les faces « Fallback » calent Arial / Times
         sur les métriques des vraies polices : le swap ne décale plus les cartes (CLS).
         Valeurs calculées avec fontTools (largeur moyenne + hhea), à refaire si on change
         de police. -->
    <!-- API (PERF_PLAN.md, P0.2) : ouvrir la connexion vers l'API (DNS + TCP + TLS)
         PENDANT le téléchargement du JS. Sans ça, elle ne démarrait qu'une fois le
         bundle exécuté et l'accueil monté (~0,9 s plus tard, mesuré le 2026-10-23).
         `crossorigin` : les GET publics partent sans cookies, donc sur la connexion
         « anonyme » — c'est elle qu'il faut ouvrir. %VITE_SOCKET_URL% est l'origine
         de l'API (vérifiée par check-env au build), remplacée par Vite. -->
    <link rel="preconnect" href="%VITE_SOCKET_URL%" crossorigin />
    <link rel="dns-prefetch" href="%VITE_SOCKET_URL%" />
    <link rel="preload" href="/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/oswald-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />
    <style>

      @font-face { font-family: 'Oswald'; font-style: normal; font-weight: 200 700; font-display: swap; src: url(/fonts/oswald-latin-ext-wght-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: 'Merriweather'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/merriweather-latin-700-normal.woff2) format('woff2'); unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
      @font-face { font-family: 'Merriweather'; font-style: normal; font-weight: 700; font-display: swap; src: url(/fonts/merriweather-latin-ext-700-normal.woff2) format('woff2'); unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
      @font-face { font-family: 'Inter Fallback'; src: local('Arial'), local('ArialMT'), local('Liberation Sans'); size-adjust: 107.02%; ascent-override: 90.52%; descent-override: 22.54%; line-gap-override: 0%; }
      @font-face { font-family: 'Oswald Fallback'; src: local('Arial Bold'), local('Arial-BoldMT'), local('Liberation Sans Bold'), local('Arial'); size-adjust: 83.96%; ascent-override: 142.10%; descent-override: 34.42%; line-gap-override: 0%; }
      @font-face { font-family: 'Merriweather Fallback'; src: local('Times New Roman Bold'), local('TimesNewRomanPS-BoldMT'), local('Liberation Serif Bold'), local('Times New Roman'); size-adjust: 113.85%; ascent-override: 86.43%; descent-override: 23.98%; line-gap-override: 0%; }

    <style>
      /* ── Design tokens ── */
      :root {
        --color-base:       #0A0E0C;
        --color-surface:    #131A12;
        --color-surface2:   #1B2419;
        --color-border:     #283323;
        --color-text:       #F3F7F0;
        --color-text-muted: #92A08A;
        --color-accent:     #9BF019;
        --color-accent2:    #008200;
        --color-edge-high:  #D2FF28;
        --color-edge-mid:   #4BD200;
        --color-edge-low:   #3A4339;
        --color-success:    #4BD200;
        --color-danger:     #E5564D;
        --color-logo-blue:  #1A8AFF;
      }

      html, body {
        height: 100%;
        margin: 0;
        background-color: var(--color-base);
        color: var(--color-text);
        font-family: 'Inter', 'Inter Fallback', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root { height: 100%; }
      ::-webkit-scrollbar { width: 0; }
      .font-display { font-family: 'Oswald', 'Oswald Fallback', sans-serif; }

      /* Crawlable fallback nav — only ever painted when JS is unavailable. */
      .no-js-nav { padding: 32px 20px; max-width: 760px; margin: 0 auto; }
      .no-js-nav h1 { font-family: 'Oswald', 'Oswald Fallback', sans-serif; font-size: 28px; margin: 0 0 8px; }
      .no-js-nav p { color: var(--color-text-muted); margin: 0 0 20px; }
      .no-js-nav ul { list-style: none; padding: 0; margin: 0; }
      .no-js-nav li { margin-bottom: 10px; }
      .no-js-nav a { color: var(--color-accent); text-decoration: none; font-weight: 500; }
    </style>

    <!--
      Structured data. Google builds sitelinks and the displayed site name from
      Organization / WebSite markup on the homepage plus its own crawl of the
      internal links below. Sitelinks cannot be requested — this only gives the
      algorithm the signals it looks for.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",

          "name": "ArakIce",

          "description": "ArakIce is a machine-learning NHL prediction platform providing win probabilities, totals and player-prop projections for informational and entertainment purposes.",

          "url": "https://arakice.com/",
          "inLanguage": ["en-CA", "fr-CA"],
          "publisher": { "@id": "https://arakice.com/#organization" }
        },
        {
          "@type": "SiteNavigationElement",
