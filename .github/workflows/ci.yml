name: CI

on:
  # ⚠️ La branche par défaut de ce dépôt est `master`, pas `main` : ne pas
  # retirer `master` de cette liste. Jusqu'au 2026-08-30 elle n'y était pas, et
  # le scan de secrets ci-dessous ne tournait donc QUE sur les pull requests —
  # une poussée directe sur la branche par défaut n'était scannée par rien.
  # `pull_request` n'a volontairement pas de filtre : tout ce qui entre dans
  # `master` est ainsi scanné, par l'un ou l'autre des deux déclencheurs.
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  secrets:
    name: Secret scan — gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan de tout l'historique, pas seulement le dernier commit
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  server:
    name: Server — typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      # Requires package-lock.json to be in sync with package.json. If this step
      # fails after dependency changes, run `npm install` in server/ and commit
      # the updated lockfile.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  client:
    name: Client — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
