name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  server:
    name: Server — typecheck, build, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      # Requires package-lock.json to be in sync with package.json. If this step
      # fails after dependency changes, run `npm install` in server/ and commit
      # the updated lockfile.
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  client:
    name: Client — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npm run build
