name: Track record

# Rebuilds RECORD.md, record.json and the cached results/ once a day, after the
# last NHL games of the night are final (west-coast games end ~06:30 UTC).
# Never touches data/: the published probabilities are written only by the
# morning job, one commit per day, and never edited.

on:
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

concurrency:
  group: arakice-nhl-predictions-writes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history: the record is proved by it

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Test
        run: node --test scripts/*.test.mjs examples/*.test.mjs

      - name: Build
        run: node scripts/build-record.mjs

      - name: Commit
        run: |
          git add RECORD.md record.json results
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="arakice-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "Track record $(date -u +%Y-%m-%d)"
          git pull --rebase --quiet
          git push
